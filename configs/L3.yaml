level: L3
name: flash-attention
description: L2 + FlashAttention backend pinned explicitly and verified from server logs.
engine: vllm
model: Qwen/Qwen3-8B
workloads: [chat, rag]
common:
  dtype: bfloat16
  max_model_len: 8192
  seed: 0
vllm:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: false
  attention_backend: FLASH_ATTN
# Side comparison: same level, other attention backends (`make sweep LEVEL=L3`).
sweep:
  grid:
    attention_backend: [FLASH_ATTN, FLASHINFER, TRITON_ATTN]
