level: L6
name: prefix-caching
description: L5 + automatic prefix caching, evaluated on a shared-system-prompt workload.
engine: vllm
model: Qwen/Qwen3-8B-AWQ
workloads: [chat, rag, shared_prefix]
common:
  dtype: float16
  max_model_len: 8192
  seed: 0
vllm:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  attention_backend: FLASH_ATTN
  quantization: awq_marlin
  enable_chunked_prefill: true
  max_num_seqs: 64            # PENDING SWEEP (copied from L5)
  max_num_batched_tokens: 4096  # PENDING SWEEP (copied from L5)
