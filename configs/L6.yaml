# STATUS: draft — finalized after the level-by-level plan is approved.
level: L6
name: prefix-caching
description: L5 + automatic prefix caching, evaluated on a shared-system-prompt workload.
engine: vllm
model: Qwen/Qwen3-8B-AWQ
common:
  dtype: float16
  max_model_len: 8192
  seed: 0
env:
  VLLM_ATTENTION_BACKEND: FLASH_ATTN
vllm:
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  quantization: awq_marlin
  max_num_seqs: 64
  max_num_batched_tokens: 4096
  enable_chunked_prefill: true
