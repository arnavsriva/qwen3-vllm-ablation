[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-inference-ablation"
version = "0.1.0"
description = "Qwen3-8B from raw weights to an optimized vLLM serving pipeline, with a layer-by-layer ablation benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# CPU-only tooling: lint + unit tests. This is all CI installs.
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pre-commit>=3.7",
]
# Benchmark client side (runs anywhere; talks to the server over HTTP).
bench = [
    "httpx>=0.27",
    "numpy>=1.26",
    "matplotlib>=3.8",
]
# Launching runs on Modal (cloud/modal_app.py). Auth: `modal setup` once.
cloud = [
    "modal>=1.4",
]
# One-off: rebuild the committed workload files (scripts/build_workloads.py).
workloads = [
    "datasets>=2.19",
    "transformers>=4.51",
    "huggingface_hub>=0.23",
]
# GPU host only. Exact versions get pinned once the VM is up (recorded in every result).
gpu = [
    "vllm",
    "transformers",
    "accelerate",
    "torch",
    "fastapi",
    "uvicorn",
]

[tool.setuptools]
packages = ["bench", "server", "cloud"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires an NVIDIA GPU (skipped in CI)",
]
